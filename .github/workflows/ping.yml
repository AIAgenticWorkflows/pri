name: Ping
# Temporary: checks that GitHub Actions can start a job in this repository.
on:
  push:
    paths: ['.github/ping']
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Actions is running" && node --version && curl -sS -m 60 -o /dev/null -w "pfu.govmu.org %{http_code} in %{time_total}s\n" https://pfu.govmu.org/max-retail-prices-s || true
